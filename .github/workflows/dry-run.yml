
name: Alpaca Strategy Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r alpaca-paper-bot/requirements.txt

      - name: Run strategy analysis
env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.EXPECTED_PAPER_ACCOUNT_ID }}
        run: python alpaca-paper-bot/bot.py
